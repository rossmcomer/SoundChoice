services:
  client:
    image: yankee3313/soundchoice-frontend
    restart: always
    ports:
      - "5000:80"

  server:
    image: yankee3313/soundchoice-backend
    environment:
      - DATABASE_URL=${PROD_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET=${STRIPE_SECRET}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_USER=${SMTP_USER}
      - CALENDAR_EMAIL=${CALENDAR_EMAIL}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    restart: always

  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - client
      - server
    restart: always